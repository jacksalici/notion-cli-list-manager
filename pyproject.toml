[project]
name = "notion-cli-list-manager"
version = "0.2.0"
description = "A simple command-line tool for managing Notion databases."
readme = "readme.md"
license = "MIT"
authors = [{ name = "Jack Salici" }]
keywords = ["notion", "cli", "todo"]
requires-python = ">=3.11"
dependencies = [
    "prettytable>=3.9",
    "requests>=2.31",
    "tomli-w>=1.0",
    "typer>=0.12",
]

[project.urls]
Repository = "https://github.com/jacksalici/notion-cli-list-manager"
Documentation = "https://github.com/jacksalici/notion-cli-list-manager/wiki"

[project.scripts]
list = "notion_cli_list_manager.cli:run"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
